name: Build national hospital data
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-national-data.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect MHLW emergency workbook
        run: |
          python -m pip install --quiet openpyxl
          python - <<'PY'
          import urllib.request, openpyxl, os
          u="https://www.mhlw.go.jp/content/10800000/001391872.xlsx"
          b=urllib.request.urlopen(u,timeout=60).read()
          open("/tmp/a.xlsx","wb").write(b)
          wb=openpyxl.load_workbook("/tmp/a.xlsx",data_only=True,read_only=True)
          print("SHEETS",wb.sheetnames)
          for ws in wb.worksheets:
              print("SHEET",ws.title,ws.max_row,ws.max_column)
              for r in ws.iter_rows(min_row=1,max_row=min(ws.max_row,20),values_only=True):
                  vals=[str(v) if v is not None else "" for v in r[:30]]
                  if any(vals):
                      print("ROW", "|".join(vals))
              print("END",ws.title)
          PY
