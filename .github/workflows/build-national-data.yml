name: Build national hospital data
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-national-data.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data.js from MHLW open data
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, re, time, urllib.request, urllib.parse, zipfile, os
          ZIP="https://www.mhlw.go.jp/content/11121000/01-1_hospital_facility_info_20260601.csv.zip"
          print("download", ZIP)
          b=urllib.request.urlopen(ZIP, timeout=60).read()
          z=zipfile.ZipFile(io.BytesIO(b))
          name=next(n for n in z.namelist() if n.lower().endswith(".csv"))
          text=z.read(name).decode("utf-8-sig", errors="replace")
          rows=list(csv.DictReader(io.StringIO(text)))
          keys=list(rows[0].keys()) if rows else []
          print("columns", len(keys))
          for k in keys: print("COL", k)

          def key(*patterns):
              for k in keys:
                  nk=re.sub(r"\s+","",k or "")
                  if any(re.search(p,nk,re.I) for p in patterns):
                      return k
              return None
          def keys_matching(*patterns):
              out=[]
              for k in keys:
                  nk=re.sub(r"\s+","",k or "")
                  if any(re.search(p,nk,re.I) for p in patterns): out.append(k)
              return out
          def yes(v):
              s=str(v or "").strip()
              return s in {"1","有","あり","○","〇","該当","はい","true","TRUE"} or "該当" in s or s=="有り"
          def number(v):
              s=re.sub(r"[^0-9.-]","",str(v or "").replace(",",""))
              try:return int(float(s)) if s else None
              except:return None

          k_name=key(r"医療機関.*名称",r"施設.*名称",r"正式名称",r"^名称$")
          k_pref=key(r"都道府県")
          k_addr=key(r"所在地$",r"住所$")
          k_lat=key(r"緯度")
          k_lng=key(r"経度")
          critical_keys=keys_matching(r"救命救急センター")
          disaster_keys=keys_matching(r"災害拠点病院")
          secondary_keys=keys_matching(r"二次救急",r"第二次救急",r"病院群輪番",r"共同利用型病院")
          ambulance_keys=keys_matching(r"救急車.*受入.*件数",r"救急搬送.*受入.*件数",r"救急車による救急患者.*受入")

          print("name",k_name,"pref",k_pref,"addr",k_addr,"lat",k_lat,"lng",k_lng)
          print("critical",critical_keys)
          print("disaster",disaster_keys)
          print("secondary",secondary_keys)
          print("ambulance",ambulance_keys)

          hospitals=[]
          for r in rows:
              name=str(r.get(k_name,"") if k_name else "").strip()
              if not name: continue
              critical=any(yes(r.get(k)) for k in critical_keys)
              disaster=any(yes(r.get(k)) for k in disaster_keys)
              secondary_flag=any(yes(r.get(k)) for k in secondary_keys)
              amb=None
              for k in ambulance_keys:
                  n=number(r.get(k))
                  if n is not None:
                      amb=max(amb or 0,n)
              secondary=secondary_flag and amb is not None and amb>=1000
              if not (critical or disaster or secondary): continue
              lat=number(r.get(k_lat)) if k_lat else None
              lng=number(r.get(k_lng)) if k_lng else None
              if lat is not None and abs(lat)>90: lat=lat/1e6
              if lng is not None and abs(lng)>180: lng=lng/1e6
              hospitals.append({
                  "name":name,
                  "pref":str(r.get(k_pref,"") if k_pref else "").strip(),
                  "address":str(r.get(k_addr,"") if k_addr else "").strip(),
                  "lat":lat,"lng":lng,
                  "critical":critical,"disaster":disaster,"secondary":secondary,
                  "ambulance":amb
              })

          # de-duplicate
          uniq={}
          for h in hospitals:
              keyv=(h["name"],h["pref"],h["address"])
              if keyv in uniq:
                  o=uniq[keyv]
                  o["critical"]|=h["critical"];o["disaster"]|=h["disaster"];o["secondary"]|=h["secondary"]
                  if h["ambulance"] is not None:o["ambulance"]=max(o["ambulance"] or 0,h["ambulance"])
              else:uniq[keyv]=h
          hospitals=list(uniq.values())
          print("selected",len(hospitals))

          # Geocode missing coordinates using GSI address search.
          def geocode(h):
              q=((h["pref"]+" ") if h["pref"] else "")+(h["address"] or h["name"])
              url="https://msearch.gsi.go.jp/address-search/AddressSearch?q="+urllib.parse.quote(q)
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"national-disaster-medical-map/1.0"})
                  j=json.loads(urllib.request.urlopen(req,timeout=15).read().decode())
                  if j:
                      c=j[0]["geometry"]["coordinates"]
                      return float(c[1]),float(c[0])
              except Exception as e:
                  print("geocode fail",h["name"],e)
              return None,None

          missing=[h for h in hospitals if h["lat"] is None or h["lng"] is None]
          print("missing coords",len(missing))
          for i,h in enumerate(missing):
              h["lat"],h["lng"]=geocode(h)
              if i%25==0: print("geocoded",i,"/",len(missing))
              time.sleep(0.08)

          hospitals=[h for h in hospitals if h["lat"] is not None and h["lng"] is not None]
          hospitals.sort(key=lambda h:(h["pref"],h["name"]))
          with open("data.js","w",encoding="utf-8") as f:
              f.write("const NATIONAL_HOSPITALS="+json.dumps(hospitals,ensure_ascii=False,separators=(",",":"))+";\n")
          print("written",len(hospitals))
          PY
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "Generate national hospital data"
          git push
